name: Bug report
description: Report a reproducible application or data integrity problem.
body:
  - type: textarea
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Synthetic reproduction
      description: Include commands, version and OS. Remove tokens, private data and database files.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Validation output
      description: Paste relevant output from python scripts/verify.py without secrets.
